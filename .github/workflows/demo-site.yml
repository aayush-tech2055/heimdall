# Publishes the fictional demo websites (test-data/website) to GitHub Pages, so the website
# fact check can be tried against a public URL instead of localhost.
# One-time setup: repository Settings > Pages > Source: "GitHub Actions".
name: Demo websites

on:
  push:
    branches: [main]
    paths: ["test-data/website/**", ".github/workflows/demo-site.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: test-data/website
      - id: deployment
        uses: actions/deploy-pages@v4
